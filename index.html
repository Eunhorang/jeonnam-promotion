<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>전남 promotion · 교감 승진 평정 계산기</title>
  <meta name="description" content="전라남도 유·초등 교사의 교감 자격연수 대상자 평정 점수(경력, 근무성적, 연수성적, 가산점)를 항목별 상한과 함께 계산하고 평정 기준일을 바꿔 앞날 점수를 미리 봅니다.">
  <meta name="theme-color" content="#f2f4f7">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="ko_KR">
  <meta property="og:title" content="전남 promotion · 교감 승진 평정 계산기">
  <meta property="og:description" content="경력·근무성적·연수성적·가산점을 항목별 상한과 함께 계산하고, 평정 기준일을 바꿔 앞날 점수를 미리 봐요.">
  <meta property="og:url" content="https://eunhorang.github.io/jeonnam-promotion/">
  <link rel="icon" href="icons/mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="fonts/pretendard/pretendard.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <a class="skip" href="#view">본문으로 건너뛰기</a>

  <header class="topbar">
    <a class="brand" href="#/">
      <svg class="mark" viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="2" width="20" height="20" rx="4" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M7 8.5h10M7 12h6.5M7 15.5h8.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      <span class="brand-name">전남 promotion</span>
    </a>
    <span class="topbar-total num" data-ledger="top"></span>
    <button type="button" class="btn menu-btn" data-action="menu-open" aria-controls="ledger" aria-expanded="false">메뉴</button>
  </header>

  <div class="app">
    <aside class="ledger" id="ledger" aria-label="평정 점수와 메뉴">
      <div class="ledger-top">
        <a class="brand" href="#/">
          <svg class="mark" viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="2" width="20" height="20" rx="4" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M7 8.5h10M7 12h6.5M7 15.5h8.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
          <span class="brand-text"><span class="brand-name">전남 promotion</span><span class="brand-sub">초등 교감 승진 평정 계산기</span></span>
        </a>
        <button type="button" class="btn menu-close" data-action="menu-close">닫기</button>
      </div>
      <label class="eval-field">
        <span class="label">평정 기준일</span>
        <select id="evalSelect" data-bind="evalDate"></select>
      </label>
      <div class="ledger-total" data-ledger="totals"></div>
      <nav class="tree" aria-label="평정 항목" data-ledger="tree"></nav>
      <div class="ledger-foot">
        <a class="t-row util" href="#/settings"><span class="t-label">설정과 저장</span></a>
        <a class="t-row util" href="#/about"><span class="t-label">근거와 안내</span></a>
        <p class="stamp" data-ledger="stamp"></p>
      </div>
    </aside>

    <main class="view" id="view" tabindex="-1">
      <noscript>
        <section class="card">
          <h1>전남 promotion</h1>
          <p>이 계산기는 브라우저의 자바스크립트로 점수를 계산해요. 자바스크립트를 켠 뒤 다시 열어 주세요.</p>
        </section>
      </noscript>
    </main>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden>
    <span id="toastText"></span>
    <button type="button" class="toast-btn" id="toastUndo" data-action="undo" hidden>되돌리기</button>
  </div>

  <dialog id="dlg" aria-labelledby="dlgTitle" aria-describedby="dlgBody">
    <h2 id="dlgTitle"></h2>
    <p id="dlgBody"></p>
    <div class="btns">
      <button type="button" class="btn" id="dlgCancel">취소</button>
      <button type="button" class="btn btn-primary" id="dlgOk">확인</button>
    </div>
  </dialog>

  <input type="file" id="importFile" accept="application/json,.json" hidden>
  <script type="module" src="js/app.js"></script>
</body>
</html>
